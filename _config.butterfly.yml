# --------------------------------------
# Butterfly 主题配置 —— Sunny-Onion's blog
# 改这里的参数就能改外观，不用碰代码
# --------------------------------------

# 导航栏
nav:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  Home: / || fas fa-home
  Archives: /archives/ || fas fa-archive
  Tags: /tags/ || fas fa-tags
  Categories: /categories/ || fas fa-folder
  About: /about/ || fas fa-user

# 社交图标（只放 GitHub）
social:
  fab fa-github: https://github.com/Sunny-Onion || GitHub || '#24292e'

# --------------------------------------
# 图片
# --------------------------------------

favicon: /images/favicon.png

avatar:
  img: /images/avatar.jpg
  effect: false

disable_top_img: false

default_top_img:
index_img: /images/banner.jpg
archive_img:
tag_img:
tag_per_img:
category_img:
category_per_img:
footer_img: false
background:

# 文章封面（没有单独指定封面的文章，从下面轮着用）
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /images/cover-1.jpg
    - /images/cover-2.jpg
    - /images/cover-3.jpg
    - /images/cover-4.jpg

# --------------------------------------
# 代码块
# --------------------------------------

code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# 文章卡片上的信息
# --------------------------------------

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页
# --------------------------------------

index_site_info_top: 62%
index_top_img_height:

subtitle:
  enable: false
  effect: true
  typed_option:
  source: false
  sub:

index_layout: 3

index_post_content:
  method: 3
  length: 500

# --------------------------------------
# 文章页
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false
  text:
  QR_code:

post_edit:
  enable: false
  url:

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# --------------------------------------
# 页脚
# --------------------------------------

footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text:

# --------------------------------------
# 侧边栏
# --------------------------------------

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: "Just a fool's blog :)"
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/Sunny-Onion
  card_announcement:
    enable: true
    content: 想到什么就写什么，随缘更新 :)
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    storage: 10
    avatar: true
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: false
    custom_colors:
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date: 2026/11/15

# --------------------------------------
# 右下角按钮
# --------------------------------------

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1
  start:
  end:

rightside_scroll_percent: true

rightside_item_order:
  enable: false
  hide:
  show:

rightside_config_animation: true

# --------------------------------------
# 全局
# --------------------------------------

anchor:
  auto_update: false
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 访问量统计（先用不到，关掉）
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 数学公式
math:
  use: mathjax
  per_page: false
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none
  katex:
    copy_tex: false

# 站内搜索
search:
  use: local_search
  placeholder: 搜索文章...
  algolia_search:
    hitsPerPage: 6
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
      CDN:
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# 分享
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# 评论（Giscus，基于 GitHub Discussions）
comments:
  use: Giscus
  text: true
  lazyload: false
  count: false
  card_post_count: false

giscus:
  repo: Sunny-Onion/sunny-onion.github.io
  repo_id: R_kgDOVvIxEA
  category_id: DIC_kwDOVvIxEM4DLMT0
  light_theme: light
  dark_theme: dark
  js:
  option:
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: bottom
    data-lang: zh-CN

# --------------------------------------
# 美化 / 动效
# --------------------------------------

theme_color:
  enable: true
  main: "#425aef"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#425aef"
  blockquote_padding_color: "#425aef"
  blockquote_background_color: "#425aef"
  scrollbar_color: "#425aef"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

rounded_corners_ui: true

text_align_justify: false

mask:
  header: false
  footer: true

# 开屏加载动画（用自定义的头像淡入，关闭主题自带的转圈动画）
preloader:
  enable: false
  source: 1
  pace_css_url:

enter_transitions: true

display_mode: light

beautify:
  enable: false
  field: post
  title_prefix_icon:
  title_prefix_icon_color:

font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

blog_title_font:
  font_link:
  font_family:

hr_icon:
  enable: true
  icon:
  icon_top:

activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

canvas_ribbon:
  enable: false
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

canvas_fluttering_ribbon:
  enable: false
  mobile: false

canvas_nest:
  enable: false
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

fireworks:
  enable: false
  zIndex: 9999
  mobile: false

click_heart:
  enable: false
  mobile: false

clickShowText:
  enable: false
  text:
  fontSize: 15px
  random: false
  mobile: false

# 图片灯箱
lightbox: fancybox

mermaid:
  enable: false
  code_write: false
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0

# --------------------------------------
# 其他
# --------------------------------------

pjax:
  enable: false
  exclude:

snackbar:
  enable: true
  position: bottom-left
  bg_light: '#425aef'
  bg_dark: '#1f1f1f'

instantpage: true

lazyload:
  enable: true
  native: true
  field: site
  placeholder:
  blur: false

pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

Open_Graph_meta:
  enable: true
  option:

structured_data:
  enable: false
  alternate_name:

css_prefix: true

# 自定义样式 / 脚本注入
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
    - <link rel="stylesheet" href="/lib/aplayer/APlayer.min.css">
    - <script src="/js/preloader.js"></script>
  bottom:
    - <script src="/lib/aplayer/APlayer.min.js"></script>
    - <script src="/js/music-player.js"></script>

CDN:
  internal_provider: local
  third_party_provider: unpkg
  version: true
  custom_format:
  option:
